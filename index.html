<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Secure Messaging System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page-wrapper">

        <!-- HEADER -->
        <header class="top-header">

            <h1>🔐 Secure Messaging System</h1>

            <p>AES Message Encryption + RSA Key Encryption</p>

        </header>


        <!-- MAIN CONTENT -->
        <main class="container">


            <!-- ENCRYPT PANEL -->
            <section class="panel">

                <h2>1. Encrypt Message</h2>

                <div class="divider"></div>


                <label for="plaintext">Plaintext Message</label>

                <textarea
                    id="plaintext"
                    placeholder="Type your secret message here..."
                ></textarea>


                <button
                    id="encryptBtn"
                    class="primary-btn"
                    type="button"
                >
                    Encrypt Message
                </button>


                <label for="encryptedKey">
                    1. Encrypted AES Key (RSA Encrypted)
                </label>

                <textarea
                    id="encryptedKey"
                    class="readonly-output"
                    readonly
                ></textarea>


                <label for="iv">
                    2. Initialization Vector (IV)
                </label>

                <input
                    id="iv"
                    class="readonly-output"
                    type="text"
                    readonly
                >


                <label for="ciphertext">
                    3. Ciphertext (AES Encrypted)
                </label>

                <textarea
                    id="ciphertext"
                    class="readonly-output"
                    readonly
                ></textarea>


                <button
                    id="autoFillBtn"
                    class="outline-btn"
                    type="button"
                >
                    Auto-Fill Decrypt Panel →
                </button>

            </section>



            <!-- DECRYPT PANEL -->
            <section class="panel">

                <h2>2. Decrypt Message</h2>

                <div class="divider"></div>


                <label for="decryptKey">
                    Encrypted AES Key
                </label>

                <textarea
                    id="decryptKey"
                    placeholder="Paste Base64 Encrypted Key"
                ></textarea>


                <label for="decryptIV">
                    Initialization Vector (IV)
                </label>

                <input
                    id="decryptIV"
                    type="text"
                    placeholder="Paste Base64 IV"
                >


                <label for="decryptCiphertext">
                    Ciphertext
                </label>

                <textarea
                    id="decryptCiphertext"
                    placeholder="Paste Base64 Ciphertext"
                ></textarea>


                <button
                    id="decryptBtn"
                    class="primary-btn"
                    type="button"
                >
                    Decrypt Message
                </button>


                <label>
                    Decrypted Plaintext Output
                </label>

                <div
                    id="decryptedOutput"
                    class="decrypted-output"
                >
                    Waiting for decryption...
                </div>

            </section>

        </main>


        <!-- STATUS -->
        <section class="status-box">

            <strong>Status:</strong>

            <span id="status">
                Generating RSA keys...
            </span>

        </section>


        <!-- FOOTER -->
        <footer>

            <p>
                Educational Hybrid Encryption Project
                • AES-GCM + RSA-OAEP
            </p>

        </footer>

    </div>


    <script src="script.js"></script>

</body>

</html>
